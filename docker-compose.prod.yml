# Orquestación de PRODUCCIÓN.
# La base de datos vive en OTRO servidor (DATABASE_URL). Aquí solo corren los
# contenedores de la app + Redis. Los archivos se guardan en la carpeta de red SMB.
#
# Todos los valores sensibles vienen del archivo .env (ver .env.example). NO subir .env a git.
#
# Despliegue:
#   1) docker compose -f docker-compose.prod.yml build
#   2) docker compose -f docker-compose.prod.yml run --rm app_api npm run db:migrate
#   3) docker compose -f docker-compose.prod.yml run --rm app_api npm run db:seed:admin
#   4) docker compose -f docker-compose.prod.yml up -d

networks:
  app_net:
    driver: bridge

volumes:
  redis_data:
  # Carpeta de red SMB (\\10.1.100.175\direccion_tics\prisma) montada como volumen.
  storage_prisma:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST}/${SMB_SHARE}"
      # uid/gid deben coincidir con el usuario que corre la API dentro del contenedor.
      # `node:20-alpine` ya trae ocupado el UID 1000 (usuario `node`), así que el
      # `adduser -S appuser` del Dockerfile recibe el 100:101. Con uid=1000 los
      # archivos quedaban a nombre de otro usuario y, al ser 0770/0660, la app no
      # podía ni entrar a la carpeta: EACCES al abrir cualquier documento.
      o: "username=${SMB_USER},password=${SMB_PASS},uid=100,gid=101,vers=3.0,file_mode=0660,dir_mode=0770"

  # Acervo del Visor de Documentos: los PDF digitalizados del SID.
  #
  # Se monta la subcarpeta `SID` del mismo recurso compartido, en SOLO LECTURA.
  # No se copia nada: son 22.6 GB y 638 mil archivos que PRISMA lee donde el SID
  # los dejó, así que cualquier documento que ellos agreguen o reemplacen se ve
  # igual desde aquí. El `ro` va aquí y en el servicio: el Visor solo lee, y más
  # vale que tampoco pueda escribir aunque la cuenta tenga permiso.
  #
  # Se monta `SID` y no el recurso completo a propósito: al mismo nivel viven
  # carpetas de otras áreas que PRISMA no tiene por qué ver.
  acervo_visor_sid:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST}/${SMB_SHARE}/SID"
      o: "username=${SMB_USER},password=${SMB_PASS},uid=100,gid=101,vers=3.0,ro,file_mode=0440,dir_mode=0550"

services:
  redis:
    image: redis:7-alpine
    container_name: prisma_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    networks: [app_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  app_api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: prisma-prod-api:latest
    container_name: prisma_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      INAPP_TRANSPORT: websocket
      OCR_PROVIDER: tesseract
      TZ: America/Cancun
    volumes:
      - storage_prisma:/app/storage
      - acervo_visor_sid:/app/storage/visor_sid:ro
    networks: [app_net]
    depends_on:
      redis:
        condition: service_healthy

  app_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: prisma_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      OCR_PROVIDER: tesseract
      TZ: America/Cancun
    volumes:
      - storage_prisma:/app/storage
    networks: [app_net]
    depends_on:
      redis:
        condition: service_healthy

  app_web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: prisma_web
    restart: unless-stopped
    environment:
      # Por ahora se entra por IP (http://IP-DE-LA-VM). DOMAIN sale del .env.
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
    networks: [app_net]
    depends_on:
      - app_api
