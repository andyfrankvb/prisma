# ─────────────────────────────────────────────────────────────
# Kubernetes: Web (Nginx static) Deployment + Service
# File: infra/k8s/web.yaml
# ─────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web
  namespace: oficialia-partes
  labels:
    app: app-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app-web
    spec:
      containers:
        - name: app-web
          image: registry.example.com/oficialia/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds:       15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds:       5

---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: oficialia-partes
spec:
  selector:
    app: app-web
  ports:
    - port: 80
      targetPort: 80
