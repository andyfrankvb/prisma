# ─────────────────────────────────────────────────────────────
# Kubernetes: Secrets template
# File: infra/k8s/secrets.yaml
#
# DO NOT store real values here.
# Use `kubectl create secret` or a secrets manager (Vault, AWS SM).
#
# Example:
#   kubectl create secret generic app-secrets \
#     --from-env-file=infra/.env \
#     -n oficialia-partes
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: oficialia-partes
type: Opaque
stringData:
  DATABASE_URL:          "postgresql://user:password@db-service:5432/oficialia_partes"
  REDIS_URL:             "redis://:password@redis-service:6379"
  JWT_SECRET:            "CHANGE_ME"
  POSTGRES_PASSWORD:     "CHANGE_ME"
  REDIS_PASSWORD:        "CHANGE_ME"
  SMTP_PASS:             "CHANGE_ME"
  AWS_ACCESS_KEY_ID:     "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
