# ─────────────────────────────────────────────────────────────
# Kubernetes: PostgreSQL 15 StatefulSet + Service + PVC
# File: infra/k8s/postgres.yaml
# ─────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: oficialia-partes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-prod
  namespace: oficialia-partes
  labels:
    app: db-prod
spec:
  serviceName: db-service
  replicas: 1
  selector:
    matchLabels:
      app: db-prod
  template:
    metadata:
      labels:
        app: db-prod
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "oficialia_partes"
            - name: POSTGRES_USER
              value: "oficialia_app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "oficialia_app", "-d", "oficialia_partes"]
            initialDelaySeconds: 30
            periodSeconds:       10
            failureThreshold:    5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "oficialia_app", "-d", "oficialia_partes"]
            initialDelaySeconds: 5
            periodSeconds:       5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: oficialia-partes
spec:
  selector:
    app: db-prod
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # Headless service for StatefulSet
