# ─────────────────────────────────────────────────────────────
# Kubernetes: Ingress (nginx-ingress-controller + cert-manager)
# File: infra/k8s/ingress.yaml
#
# Prerequisites:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
# ─────────────────────────────────────────────────────────────

---
# ClusterIssuer: Let's Encrypt production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@gobierno.mx
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Ingress resource
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficialia-ingress
  namespace: oficialia-partes
  annotations:
    kubernetes.io/ingress.class:                "nginx"
    cert-manager.io/cluster-issuer:             "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect:   "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps:      "30"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout:  "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout:  "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - oficialia.gobierno.mx
      secretName: oficialia-tls
  rules:
    - host: oficialia.gobierno.mx
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3000
          # WebSocket
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3000
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
