# ─────────────────────────────────────────────────────────────
# Nginx: Configuración principal — DESARROLLO LOCAL
# File: infra/nginx/nginx.dev.conf
#
# Sin bloque upstream — los proxy_pass usan host:puerto directo.
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Rate limiting (más permisivo en dev)
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=100r/s;
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
